<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal Hunter - Best few today</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eaf0ea;
      --app: #fffefb;
      --ink: #171b18;
      --soft-ink: #3d463f;
      --muted: #69746c;
      --quiet: #8a948d;
      --line: #dfe7df;
      --line-strong: #c7d3c9;
      --panel: #f6f9f5;
      --card: #ffffff;
      --green: #1f6f47;
      --green-soft: #e4f1e8;
      --berry: #9a2d5b;
      --berry-soft: #f7e8ef;
      --teal: #135e66;
      --teal-soft: #e4f0f1;
      --shadow: 0 20px 58px rgba(24, 32, 25, 0.16);
      --soft-shadow: 0 10px 28px rgba(24, 32, 25, 0.08);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 8%, rgba(31, 111, 71, 0.12), transparent 30%),
        linear-gradient(160deg, #eef5ef 0%, #e9eff0 48%, #f3f6f1 100%);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 22px 14px;
    }

    button {
      appearance: none;
      border: 0;
      font: inherit;
      color: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .phone {
      width: min(100%, 390px);
      min-height: 844px;
      overflow: hidden;
      border: 1px solid rgba(24, 32, 25, 0.12);
      border-radius: 34px;
      background: var(--app);
      box-shadow: var(--shadow);
    }

    .screen {
      min-height: 844px;
      background: linear-gradient(180deg, #fffefb 0%, #f8fbf7 58%, #eef5f0 100%);
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 18px 12px;
      background: rgba(255, 254, 251, 0.94);
      border-bottom: 1px solid rgba(223, 231, 223, 0.75);
      backdrop-filter: blur(18px);
    }

    .brand {
      min-width: 0;
    }

    .brand strong {
      display: block;
      font-size: 22px;
      line-height: 1.05;
      font-weight: 800;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .store-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      max-width: 128px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--soft-ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(24, 32, 25, 0.05);
    }

    main {
      padding: 16px 16px 24px;
    }

    .hero {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--soft-shadow);
    }

    .hero-photo-wrap {
      position: relative;
      aspect-ratio: 1.04 / 1;
      overflow: hidden;
      background: linear-gradient(180deg, #f8faf8, #edf5ef);
    }

    .hero-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-badge {
      position: absolute;
      left: 14px;
      top: 14px;
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(24, 32, 25, 0.10);
    }

    .hero-copy {
      padding: 17px 16px 16px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      max-width: 310px;
      font-size: 28px;
      line-height: 1.03;
      font-weight: 850;
      letter-spacing: 0;
    }

    .price-row {
      display: flex;
      align-items: end;
      gap: 10px;
      margin-top: 14px;
    }

    .price {
      color: var(--berry);
      font-size: 54px;
      line-height: 0.88;
      font-weight: 900;
      letter-spacing: 0;
    }

    .was {
      padding-bottom: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.2;
      font-weight: 700;
    }

    .was s {
      color: var(--quiet);
      text-decoration-thickness: 2px;
    }

    .how {
      margin-top: 12px;
      color: var(--soft-ink);
      font-size: 15px;
      line-height: 1.35;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 16px;
    }

    .primary,
    .secondary {
      min-height: 48px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
    }

    .primary {
      background: var(--ink);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(23, 27, 24, 0.18);
    }

    .secondary {
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--soft-ink);
    }

    .honest-line {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 2px 12px;
    }

    .section-head h2 {
      font-size: 20px;
      line-height: 1.1;
      font-weight: 850;
    }

    .section-head span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .deal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .deal-card {
      overflow: hidden;
      min-height: 226px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      text-align: left;
      box-shadow: 0 8px 22px rgba(24, 32, 25, 0.06);
    }

    .deal-card img {
      width: 100%;
      aspect-ratio: 1 / 0.86;
      object-fit: cover;
      display: block;
      background: var(--panel);
    }

    .deal-card-copy {
      padding: 10px 10px 12px;
    }

    .deal-card h3 {
      min-height: 40px;
      font-size: 14px;
      line-height: 1.18;
      font-weight: 800;
    }

    .mini-price {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 8px;
    }

    .mini-price strong {
      color: var(--berry);
      font-size: 23px;
      line-height: 1;
      font-weight: 900;
    }

    .mini-price span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .retailer {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.15;
      font-weight: 750;
    }

    .stores {
      display: grid;
      gap: 10px;
    }

    .store-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 66px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      text-align: left;
      box-shadow: 0 8px 20px rgba(24, 32, 25, 0.05);
    }

    .store-row strong {
      display: block;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 850;
    }

    .store-row span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .store-row em {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal);
      font-style: normal;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      place-items: end center;
      padding: 14px;
      background: rgba(18, 23, 20, 0.34);
    }

    .sheet[aria-hidden="false"] {
      display: grid;
    }

    .detail {
      width: min(100%, 390px);
      max-height: min(92vh, 824px);
      overflow: auto;
      border-radius: 28px 28px 24px 24px;
      background: var(--app);
      box-shadow: 0 24px 70px rgba(10, 15, 12, 0.28);
    }

    .detail-top {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      padding: 10px;
      background: rgba(255, 254, 251, 0.84);
      backdrop-filter: blur(12px);
    }

    .close {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #ffffff;
      color: var(--soft-ink);
      font-size: 22px;
      line-height: 1;
      box-shadow: 0 5px 14px rgba(24, 32, 25, 0.08);
    }

    .detail-photo {
      width: calc(100% - 28px);
      aspect-ratio: 1 / 0.88;
      object-fit: cover;
      display: block;
      margin: 0 14px;
      border-radius: 22px;
      background: var(--panel);
    }

    .detail-copy {
      padding: 16px 18px 22px;
    }

    .detail-copy h2 {
      font-size: 27px;
      line-height: 1.05;
      font-weight: 850;
    }

    .detail-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .detail-section h3 {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 850;
    }

    .detail-section p {
      margin-top: 8px;
      color: var(--soft-ink);
      font-size: 15px;
      line-height: 1.42;
    }

    .sku-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding: 13px 14px;
      border: 1px dashed var(--line-strong);
      border-radius: 16px;
      background: var(--panel);
      color: var(--ink);
      font-size: 15px;
      font-weight: 850;
    }

    .sku-line span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .fallback {
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 32px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        background: var(--app);
      }

      .phone {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .screen {
        min-height: 100vh;
      }

      .sheet {
        padding: 0;
      }

      .detail {
        width: 100%;
        max-height: 96vh;
        border-radius: 26px 26px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <header class="top">
        <div class="brand">
          <strong>Deal Hunter</strong>
          <span>Best finds from real shoppers</span>
        </div>
        <button class="store-pill" type="button">Your stores</button>
      </header>

      <main id="app">
        <div class="fallback">Loading real deal photos.</div>
      </main>
    </div>
  </div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <article class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-top">
        <button class="close" type="button" id="closeDetail" aria-label="Close">×</button>
      </div>
      <img class="detail-photo" id="detailPhoto" alt="" onerror="this.style.visibility='hidden'">
      <div class="detail-copy">
        <span class="verified" id="detailTrust">✓ Verified product</span>
        <h2 id="detail-title"></h2>
        <div class="price-row">
          <div class="price" id="detailPrice"></div>
          <div class="was" id="detailWas"></div>
        </div>
        <div class="detail-section">
          <h3>How to get it</h3>
          <p id="detailHow"></p>
        </div>
        <div class="detail-section">
          <h3>How to find it in the store</h3>
          <p id="detailFind"></p>
          <div class="sku-line"><span>Scan in store</span><strong id="detailSku"></strong></div>
        </div>
        <p class="honest-line">Prices change — check the tag in store.</p>
      </div>
    </article>
  </div>

  <script src="../deal-hunter-staging/data.js"></script>
  <script>
    const DEALS = (window.STAGING_DEALS || []);
    const photoDeals = DEALS.filter((deal) => deal.image);
    const imageBase = "../deal-hunter-staging/";

    const friendlyNames = {
      "379530": "Baby Shark baby shampoo 1 oz",
      "379537": "Baby Shark baby lotion 1 oz",
      "390887": "Elmo black crew socks",
      "393236": "Mona Lisa crew socks",
      "396424": "X-Men logo crew socks",
      "397121": "Mountain Dew crew socks",
      "397124": "Oscar Mayer crew socks",
      "397126": "Kool-Aid men's crew socks",
      "397599": "Smurfs Grumpy crew socks",
      "397740": "Cheez-It crew socks",
      "401005": "Spiderman face crew socks",
      "401257": "Rice Krispies Joyful socks",
      "404079": "Kids licensed Smurfs crew socks",
      "412418": "Silicone snack topper tray",
      "367385": "Bathroom cleaner kit"
    };

    const findTips = {
      "412418": "Check checkout lanes, end caps, and summer drinkware displays. Look for the flower-shaped snack tray that sits on top of a tumbler.",
      "396424": "Check the sock pegs in apparel. Look for bright yellow crew socks with X-Men logos.",
      "404079": "Check kids socks in apparel. Look for the Smurfs crew socks and compare the SKU before buying.",
      "379530": "Check travel-size baby care and bath items. Look for the small Baby Shark shampoo bottle.",
      "379537": "Check travel-size baby care and bath items. Look for the small Baby Shark lotion bottle.",
      "367385": "Check household cleaners. Look for the bathroom cleaner kit, then scan the SKU in store."
    };

    const wantedSkus = ["412418", "396424", "404079", "379530", "379537", "397121", "401257", "367385"];

    function normalizeSku(value) {
      return String(value || "").trim();
    }

    function isPenny(deal) {
      return deal.price === "$0.01" || deal.dealType === "penny" || deal.dealType === "dt-penny-list";
    }

    function cents(price) {
      return price === "$0.01" ? "1¢" : (price || "See price");
    }

    function cleanTitle(deal) {
      const sku = normalizeSku(deal.sku);
      if (friendlyNames[sku]) return friendlyNames[sku];
      const raw = String(deal.title || "Shopper-reported deal").trim();
      return raw
        .replace(/\bLic\b/g, "licensed")
        .replace(/\bQtr\b/g, "quarter")
        .replace(/\bBlk\b/g, "black")
        .replace(/\bGry\b/g, "gray")
        .replace(/\b1oz\b/gi, "1 oz")
        .replace(/\s+/g, " ");
    }

    function priceStory(deal) {
      const price = cents(deal.price);
      const was = deal.was || (isPenny(deal) ? "$1.25" : "");
      if (price === "1¢" && was) return `Was ${was} → now 1¢`;
      if (was) return `Was ${was} → now ${price}`;
      return `${price} at ${deal.retailer || "this store"}`;
    }

    function uniqueBySku(items) {
      const seen = new Set();
      return items.filter((deal) => {
        const key = normalizeSku(deal.sku) || deal.id;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function pickDeals() {
      const wanted = wantedSkus
        .map((sku) => photoDeals.find((deal) => normalizeSku(deal.sku) === sku && isPenny(deal)))
        .filter(Boolean);
      const penny = photoDeals
        .filter((deal) => isPenny(deal))
        .sort((a, b) => Number(b.was ? 1 : 0) - Number(a.was ? 1 : 0));
      return uniqueBySku([...wanted, ...penny]).slice(0, 7);
    }

    const chosenDeals = pickDeals();
    const hero = chosenDeals[0];
    const cards = chosenDeals.slice(1, 7);
    const app = document.getElementById("app");
    const sheet = document.getElementById("sheet");

    function imageSrc(deal) {
      return imageBase + deal.image;
    }

    function cardTemplate(deal, index) {
      return `
        <button class="deal-card" type="button" data-deal-index="${index + 1}">
          <img src="${imageSrc(deal)}" alt="${cleanTitle(deal)}" onerror="this.style.visibility='hidden'">
          <div class="deal-card-copy">
            <h3>${cleanTitle(deal)}</h3>
            <div class="mini-price"><strong>${cents(deal.price)}</strong><span>${deal.retailer || "Store deal"}</span></div>
            <div class="retailer">${priceStory(deal)}</div>
          </div>
        </button>
      `;
    }

    function render() {
      if (!hero) {
        app.innerHTML = '<div class="fallback">No real product photos are available right now.</div>';
        return;
      }

      app.innerHTML = `
        <section class="hero">
          <button class="hero-photo-wrap" type="button" data-deal-index="0" aria-label="See deal">
            <img class="hero-photo" src="${imageSrc(hero)}" alt="${cleanTitle(hero)}" onerror="this.style.visibility='hidden'">
            <span class="hero-badge">1¢ at Dollar Tree</span>
          </button>
          <div class="hero-copy">
            <div class="eyebrow"><span class="verified">✓ Verified product</span><span>${hero.retailer || "Dollar Tree"}</span></div>
            <h1>${cleanTitle(hero)}</h1>
            <div class="price-row">
              <div class="price">${cents(hero.price)}</div>
              <div class="was">${hero.was ? `Was <s>${hero.was}</s>` : "Was <s>$1.25</s>"}</div>
            </div>
            <p class="how">Scan in store (SKU ${hero.sku}). Look near checkout and seasonal drinkware.</p>
            <div class="action-row">
              <button class="primary" type="button" data-deal-index="0">Find in store</button>
              <button class="secondary" type="button" data-deal-index="0">See deal</button>
            </div>
            <p class="honest-line">Prices change — check the tag in store.</p>
          </div>
        </section>

        <section>
          <div class="section-head">
            <h2>Best deals today</h2>
            <span>${cards.length} real photos</span>
          </div>
          <div class="deal-grid">
            ${cards.map(cardTemplate).join("")}
          </div>
        </section>

        <section>
          <div class="section-head">
            <h2>Your stores</h2>
            <span>More deals</span>
          </div>
          <div class="stores">
            <button class="store-row" type="button">
              <span><strong>Dollar Tree</strong><span>Lots of 1¢ finds reported by shoppers</span></span>
              <em>Best photos</em>
            </button>
            <button class="store-row" type="button">
              <span><strong>H-E-B</strong><span>Bathroom cleaner deal reported for $1.00</span></span>
              <em>$1.00</em>
            </button>
            <button class="store-row" type="button">
              <span><strong>Walgreens</strong><span>Cleaner deal shoppers reported</span></span>
              <em>Check tag</em>
            </button>
          </div>
        </section>
      `;

      app.querySelectorAll("[data-deal-index]").forEach((button) => {
        button.addEventListener("click", () => openDetail(chosenDeals[Number(button.dataset.dealIndex)]));
      });
    }

    function openDetail(deal) {
      const title = cleanTitle(deal);
      document.getElementById("detailPhoto").src = imageSrc(deal);
      document.getElementById("detailPhoto").alt = title;
      document.getElementById("detailTrust").textContent = isPenny(deal) ? "✓ Verified product" : "Shoppers reported this";
      document.getElementById("detail-title").textContent = title;
      document.getElementById("detailPrice").textContent = cents(deal.price);
      document.getElementById("detailWas").innerHTML = deal.was ? `Was <s>${deal.was}</s>` : (isPenny(deal) ? "Was <s>$1.25</s>" : "");
      document.getElementById("detailHow").textContent = isPenny(deal)
        ? `Scan in store (SKU ${deal.sku}). If it rings up at 1¢, it is the deal shoppers reported.`
        : "Might not ring up — worth a look, don't count on it.";
      document.getElementById("detailFind").textContent = findTips[normalizeSku(deal.sku)] || "Match the photo first, then scan the SKU in store before buying.";
      document.getElementById("detailSku").textContent = `SKU ${deal.sku || "check photo"}`;
      sheet.setAttribute("aria-hidden", "false");
    }

    function closeDetail() {
      sheet.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeDetail").addEventListener("click", closeDetail);
    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) closeDetail();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDetail();
    });

    render();
  </script>
</body>
</html>
