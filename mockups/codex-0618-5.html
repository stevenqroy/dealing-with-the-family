<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal Hunter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172321;
      --muted: #667773;
      --soft: #f4faf7;
      --panel: #ffffff;
      --line: #dce9e4;
      --green: #146b53;
      --green-2: #0f4d40;
      --mint: #e4f4ed;
      --blue: #284b63;
      --pink: #b12d6d;
      --shadow: 0 18px 44px rgba(22, 45, 39, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(228, 244, 237, .95), rgba(244, 250, 247, .5) 35%, rgba(238, 246, 242, .9) 100%),
        #eef6f2;
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 18px 0;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .phone {
      width: min(100vw, 414px);
      min-height: 100vh;
      background: var(--soft);
      border: 1px solid rgba(20, 107, 83, .16);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      padding: 18px 18px 26px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: grid;
      gap: 1px;
    }

    .brand strong {
      font-size: 24px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .store-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(255, 255, 255, .72);
      color: var(--green-2);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    section {
      margin-top: 24px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    h1, h2, h3, p { margin: 0; }

    h2 {
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .tiny-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(25, 58, 50, .08);
    }

    .hero-photo {
      position: relative;
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      aspect-ratio: 1 / .86;
      background: #f8fcfa;
      overflow: hidden;
      cursor: pointer;
    }

    .hero-photo img,
    .deal-card img,
    .category-photo img,
    .sheet-photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hero-photo img {
      padding: 12px;
    }

    .price-badge {
      position: absolute;
      left: 12px;
      bottom: 12px;
      min-width: 94px;
      border-radius: 8px;
      padding: 9px 10px 10px;
      background: rgba(255, 255, 255, .93);
      border: 1px solid rgba(20, 107, 83, .18);
      box-shadow: 0 10px 26px rgba(20, 35, 31, .12);
    }

    .price-badge strong {
      display: block;
      color: var(--green);
      font-size: 35px;
      line-height: .95;
      letter-spacing: 0;
    }

    .price-badge span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-body {
      padding: 15px;
      display: grid;
      gap: 12px;
    }

    .deal-title {
      font-size: 22px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .quiet-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f9fdfb;
      color: var(--green-2);
      font-size: 12px;
      font-weight: 700;
    }

    .price-story {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .price-story strong {
      font-size: 40px;
      line-height: 1;
      color: var(--green);
      letter-spacing: 0;
    }

    .price-story span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .price-story del {
      color: #80918d;
      text-decoration-thickness: 2px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary, .secondary {
      border: 0;
      border-radius: 8px;
      min-height: 46px;
      padding: 12px 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: var(--green);
      color: white;
    }

    .secondary {
      background: var(--mint);
      color: var(--green-2);
      border: 1px solid rgba(20, 107, 83, .14);
    }

    .rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 142px;
      gap: 12px;
      overflow-x: auto;
      padding: 1px 2px 10px;
      margin: 0 -2px;
      scroll-snap-type: x proximity;
    }

    .rail::-webkit-scrollbar { height: 0; }

    .deal-card {
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      text-align: left;
      padding: 0;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(25, 58, 50, .06);
    }

    .deal-card .photo {
      height: 126px;
      background: #fbfefd;
      border-bottom: 1px solid var(--line);
    }

    .deal-card .photo img {
      padding: 10px;
    }

    .card-body {
      min-height: 114px;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 7px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .card-price {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .card-price strong {
      color: var(--green);
      font-size: 22px;
      line-height: 1;
    }

    .card-price span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: right;
    }

    .store-list {
      display: grid;
      gap: 8px;
    }

    .store-row {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .78);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .store-row strong {
      display: block;
      font-size: 15px;
      line-height: 1.2;
    }

    .store-row span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .store-count {
      color: var(--blue);
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .category-tile {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }

    .category-photo {
      height: 112px;
      background: #fbfefd;
      border-bottom: 1px solid var(--line);
    }

    .category-photo img {
      padding: 9px;
    }

    .category-copy {
      padding: 10px;
      display: grid;
      gap: 3px;
    }

    .category-copy strong {
      font-size: 14px;
      line-height: 1.1;
    }

    .category-copy span {
      color: var(--muted);
      font-size: 12px;
    }

    .plain-deals {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .74);
      overflow: hidden;
    }

    .plain-deal {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px;
      border-top: 1px solid var(--line);
    }

    .plain-deal:first-child { border-top: 0; }

    .plain-deal strong {
      font-size: 14px;
      line-height: 1.2;
    }

    .plain-deal span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .plain-price {
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .honest-note {
      margin-top: 24px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .sheet {
      position: fixed;
      inset: 0;
      display: none;
      align-items: end;
      justify-content: center;
      background: rgba(12, 24, 22, .32);
      padding: 14px;
      z-index: 10;
    }

    .sheet[aria-hidden="false"] { display: flex; }

    .sheet-panel {
      width: min(100%, 390px);
      max-height: 92vh;
      overflow: auto;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(12, 24, 22, .28);
    }

    .sheet-top {
      display: flex;
      justify-content: flex-end;
      padding: 9px 9px 0;
    }

    .close {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f9fdfb;
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .sheet-photo {
      height: 260px;
      margin: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfefd;
      overflow: hidden;
    }

    .sheet-photo img {
      padding: 14px;
    }

    .sheet-body {
      padding: 15px 16px 18px;
      display: grid;
      gap: 14px;
    }

    .sheet-body h3 {
      font-size: 22px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .info-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .info-box strong {
      font-size: 14px;
    }

    .info-box p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      display: none;
      padding: 40px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    @media (min-width: 430px) {
      body { padding: 20px 0; }
      .phone {
        min-height: calc(100vh - 40px);
        border-radius: 28px;
      }
      .app { min-height: calc(100vh - 40px); }
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <strong>Deal Hunter</strong>
          <span>Best deals today</span>
        </div>
        <div class="store-pill">Your stores</div>
      </div>

      <div class="empty" id="empty">No photo deals loaded yet.</div>

      <section id="heroSection" aria-label="Today's best deal"></section>

      <section>
        <div class="section-head">
          <h2>More great deals</h2>
          <span class="tiny-note">Swipe sideways</span>
        </div>
        <div class="rail" id="dealRail" aria-label="More great deals"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Your stores</h2>
        </div>
        <div class="store-list" id="storeList"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Browse by category</h2>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Other deals to check</h2>
        </div>
        <div class="plain-deals" id="plainDeals"></div>
      </section>

      <p class="honest-note">These are deals shoppers reported — prices change, so check the tag in store.</p>
    </div>
  </main>

  <div class="sheet" id="detailSheet" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Deal details">
    <div class="sheet-panel">
      <div class="sheet-top">
        <button class="close" type="button" id="closeSheet" aria-label="Close">×</button>
      </div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <script src="../deal-hunter-staging/data.js"></script>
  <script>
    const DEALS = (window.STAGING_DEALS || []);
    const PHOTO_BASE = '../deal-hunter-staging/';
    const photoDeals = DEALS.filter(d => d.image);

    const preferredSkus = ['412418', '396424', '397599', '379530', '367385', '397121', '401005', '404124', '390887', '397740', '404125', '402677'];
    const categorySkus = ['397599', '412418', '367385', '379530'];

    const bySku = sku => photoDeals.find(d => String(d.sku) === sku || (d.image || '').includes(sku));
    const uniqueBySku = deals => {
      const seen = new Set();
      return deals.filter(d => {
        const key = d.sku || d.id || d.title;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    };

    const chosen = uniqueBySku([
      ...preferredSkus.map(bySku).filter(Boolean),
      ...photoDeals
    ]).slice(0, 14);

    const titleCaseWords = new Set(['x-men', 'h-e-b', 'e.t.', 'xoxo']);
    function sentenceTitle(value) {
      const clean = String(value || 'Deal').replace(/\s+/g, ' ').trim();
      return clean.split(' ').map((word, index) => {
        const lower = word.toLowerCase();
        if (titleCaseWords.has(lower)) return word;
        if (/^[A-Z0-9.-]{2,}$/.test(word) && index !== 0) return word;
        const fixed = lower.replace(/^([a-z])/, m => m.toUpperCase());
        return index === 0 ? fixed : lower;
      }).join(' ');
    }

    function shortTitle(value) {
      return sentenceTitle(value)
        .replace(/\blic\b/i, 'licensed')
        .replace(/\bqtr\b/i, 'quarter')
        .replace(/\bblk\b/i, 'black')
        .replace(/\bgrn\b/i, 'green')
        .replace(/\bstrp\b/i, 'stripe')
        .replace(/\bgry\b/i, 'gray')
        .replace(/\s+2$/, '');
    }

    function imgSrc(deal) {
      return PHOTO_BASE + deal.image;
    }

    function priceText(deal) {
      return deal.price || 'Check price';
    }

    function priceStory(deal) {
      const price = priceText(deal);
      if (deal.was && deal.price) return `Was ${deal.was} → now ${price}`;
      if (deal.price === '$0.01') return '1¢ at Dollar Tree';
      if (deal.dealType === 'glitch') return `${price} reported`;
      return deal.was ? `Was ${deal.was}` : 'Shoppers reported this';
    }

    function trustLine(deal) {
      if (deal.sku) return '✓ Verified product';
      return 'Shoppers reported this';
    }

    function findLine(deal) {
      if (deal.sku) return `Scan in store (SKU ${deal.sku})`;
      return 'Check the shelf tag in store';
    }

    function aisleLine(deal) {
      const cat = String(deal.category || '').toLowerCase();
      if (cat.includes('sock') || cat.includes('apparel')) return 'Look in socks and seasonal bins. Match the picture first, then scan the SKU.';
      if (cat.includes('kitchen')) return 'Look near drink cups, party supplies, or kitchen add-ons. Match the shape and color before scanning.';
      if (cat.includes('clean')) return 'Look with bathroom cleaners and starter kits. Check both the shelf tag and the register price.';
      if (cat.includes('baby') || cat.includes('personal')) return 'Look near travel-size personal care. Match the front label and size.';
      return 'Use the photo first, then scan the SKU in the store app or at checkout.';
    }

    function photoMarkup(deal, alt) {
      return `<img src="${imgSrc(deal)}" alt="${alt}" onerror="this.style.visibility='hidden'">`;
    }

    function openDeal(deal) {
      const sheet = document.getElementById('detailSheet');
      const content = document.getElementById('sheetContent');
      const title = shortTitle(deal.title);
      content.innerHTML = `
        <div class="sheet-photo">${photoMarkup(deal, title)}</div>
        <div class="sheet-body">
          <div class="meta-row"><span>${deal.retailer || 'Store'}</span><span class="quiet-tag">${trustLine(deal)}</span></div>
          <h3>${title}</h3>
          <div class="price-story"><strong>${priceText(deal)}</strong><span>${priceStory(deal)}</span></div>
          <div class="info-box">
            <strong>How to get it</strong>
            <p>${deal.dealType === 'glitch' ? "Might not ring up — worth a look, don't count on it." : 'Find the matching item, check the tag, then scan it in store.'}</p>
          </div>
          <div class="info-box">
            <strong>How to find it in the store</strong>
            <p>${aisleLine(deal)}</p>
            <p>${findLine(deal)}</p>
          </div>
          <button class="primary" type="button">${findLine(deal)}</button>
        </div>
      `;
      sheet.setAttribute('aria-hidden', 'false');
    }

    function renderHero(deal) {
      const title = shortTitle(deal.title);
      document.getElementById('heroSection').innerHTML = `
        <div class="section-head">
          <h2>Today's best deal</h2>
          <span class="quiet-tag">${trustLine(deal)}</span>
        </div>
        <article class="hero">
          <button class="hero-photo" type="button" aria-label="See ${title}" data-deal-id="${deal.id}">
            ${photoMarkup(deal, title)}
            <div class="price-badge"><strong>${priceText(deal).replace('$0.01', '1¢')}</strong><span>${deal.retailer || 'Store'}</span></div>
          </button>
          <div class="hero-body">
            <div class="meta-row"><span>${deal.retailer || 'Store'}</span><span>${priceStory(deal)}</span></div>
            <h1 class="deal-title">${title}</h1>
            <div class="price-story"><strong>${priceText(deal)}</strong><span>${priceStory(deal)}</span></div>
            <div class="actions">
              <button class="primary" type="button" data-deal-id="${deal.id}">Find in store</button>
              <button class="secondary" type="button" data-deal-id="${deal.id}">See deal</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderRail(deals) {
      document.getElementById('dealRail').innerHTML = deals.map(deal => {
        const title = shortTitle(deal.title);
        return `
          <button class="deal-card" type="button" data-deal-id="${deal.id}">
            <div class="photo">${photoMarkup(deal, title)}</div>
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-price"><strong>${priceText(deal).replace('$0.01', '1¢')}</strong><span>${deal.retailer || 'Store'}</span></div>
              <span class="tiny-note">${deal.sku ? 'SKU ' + deal.sku : 'Check tag'}</span>
            </div>
          </button>
        `;
      }).join('');
    }

    function renderStores() {
      const dollarPhotoCount = photoDeals.filter(d => d.retailer === 'Dollar Tree' && d.price === '$0.01').length;
      const otherStores = uniqueBySku(DEALS.filter(d => d.retailer && d.retailer !== 'Dollar Tree')).slice(0, 18);
      const rows = [
        { name: 'Dollar Tree', copy: 'Lots of 1¢ finds today', count: dollarPhotoCount + '+' },
        { name: 'H-E-B', copy: 'Bathroom cleaner deal shoppers reported', count: '$1' },
        { name: 'Walgreens', copy: 'Check cleaner and personal care tags', count: otherStores.filter(d => d.retailer === 'Walgreens').length || 'New' }
      ];
      document.getElementById('storeList').innerHTML = rows.map(row => `
        <div class="store-row">
          <div><strong>${row.name}</strong><span>${row.copy}</span></div>
          <div class="store-count">${row.count}</div>
        </div>
      `).join('');
    }

    function renderCategories() {
      const fallback = chosen.slice(0, 4);
      const categories = [
        { label: 'Kids and socks', sku: '397599', count: '1¢ finds' },
        { label: 'Kitchen', sku: '412418', count: 'Tray and cup items' },
        { label: 'Cleaning', sku: '367385', count: '$1 deal' },
        { label: 'Baby care', sku: '379530', count: 'Travel size finds' }
      ].map((item, index) => ({ ...item, deal: bySku(item.sku) || fallback[index] })).filter(item => item.deal);

      document.getElementById('categoryGrid').innerHTML = categories.map(item => `
        <button class="category-tile" type="button" data-deal-id="${item.deal.id}">
          <div class="category-photo">${photoMarkup(item.deal, item.label)}</div>
          <div class="category-copy"><strong>${item.label}</strong><span>${item.count}</span></div>
        </button>
      `).join('');
    }

    function renderPlainDeals() {
      const textDeals = uniqueBySku(DEALS.filter(d => !d.image && d.retailer && d.title && d.price)).slice(0, 3);
      document.getElementById('plainDeals').innerHTML = textDeals.map(deal => `
        <div class="plain-deal">
          <div><strong>${shortTitle(deal.title)}</strong><span>${deal.retailer} · ${deal.dealType === 'glitch' ? "Might not ring up — don't count on it" : 'Check the tag in store'}</span></div>
          <div class="plain-price">${priceText(deal)}</div>
        </div>
      `).join('');
    }

    function bindDealClicks() {
      document.body.addEventListener('click', event => {
        const trigger = event.target.closest('[data-deal-id]');
        if (!trigger) return;
        const deal = chosen.find(d => d.id === trigger.dataset.dealId) || photoDeals.find(d => d.id === trigger.dataset.dealId);
        if (deal) openDeal(deal);
      });
    }

    function start() {
      if (!chosen.length) {
        document.getElementById('empty').style.display = 'block';
        return;
      }
      renderHero(chosen[0]);
      renderRail(chosen.slice(1, 9));
      renderStores();
      renderCategories();
      renderPlainDeals();
      bindDealClicks();
    }

    document.getElementById('closeSheet').addEventListener('click', () => {
      document.getElementById('detailSheet').setAttribute('aria-hidden', 'true');
    });

    document.getElementById('detailSheet').addEventListener('click', event => {
      if (event.target.id === 'detailSheet') event.currentTarget.setAttribute('aria-hidden', 'true');
    });

    start();
  </script>
</body>
</html>
