<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Hunter — Pick a store</title>
<style>
  :root{
    --ink:#15171c;            /* near-black text */
    --ink-soft:#5b6270;       /* secondary text */
    --ink-faint:#8a909c;      /* hints */
    --line:#e9ebef;           /* hairlines */
    --line-soft:#f1f2f5;
    --bg:#f5f6f8;             /* page behind cards */
    --card:#ffffff;
    --teal:#0f6e56;           /* primary accent (calm green-teal, no orange) */
    --teal-soft:#e4f3ee;
    --teal-ink:#0b5945;
    --penny:#0f6e56;          /* the 1¢ win color */
    --blue:#185fa5;
    --blue-soft:#e9f1fb;
    --gold:#7a5b12;           /* rare/valuable, muted — for resellers */
    --gold-soft:#f6efdd;
    --shadow:0 1px 2px rgba(20,23,28,.05), 0 6px 20px rgba(20,23,28,.06);
    --shadow-sm:0 1px 2px rgba(20,23,28,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#dfe2e7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;
    padding:22px 0 40px;
  }
  /* phone frame */
  .phone{
    width:404px;
    background:var(--bg);
    border-radius:42px;
    box-shadow:0 0 0 11px #14161b, 0 24px 60px rgba(0,0,0,.34);
    overflow:hidden;
    position:relative;
  }
  .screen{height:858px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .screen::-webkit-scrollbar{width:0;display:none}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:148px;height:30px;background:#14161b;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:60}

  /* status bar */
  .status{display:flex;justify-content:space-between;align-items:center;padding:13px 26px 4px;font-size:13px;font-weight:600;color:var(--ink)}
  .status .dots{display:flex;gap:5px;align-items:center}
  .status .dots svg{display:block}

  /* generic */
  .pad{padding:0 18px}
  .view{display:none;animation:fade .28s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .muted{color:var(--ink-soft)}
  .faint{color:var(--ink-faint)}

  /* ---------- HOME header ---------- */
  .home-head{padding:6px 18px 8px}
  .home-head .hi{font-size:14px;color:var(--ink-soft);font-weight:500}
  .home-head h1{font-size:27px;line-height:1.12;margin:3px 0 0;font-weight:700;letter-spacing:-.4px}
  .home-head h1 .accent{color:var(--teal)}
  .loc{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:13.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:999px;box-shadow:var(--shadow-sm)}
  .loc svg{width:13px;height:13px}
  .loc b{color:var(--ink);font-weight:600}

  .section-label{display:flex;align-items:baseline;justify-content:space-between;margin:18px 18px 10px}
  .section-label h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin:0;font-weight:700}
  .section-label .cnt{font-size:12.5px;color:var(--ink-faint)}

  /* ---------- store card ---------- */
  .store-card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    margin:0 18px 13px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .store-card:active{transform:scale(.985)}
  .store-card.feature{border-color:#d7e8e1}
  .sc-top{display:flex;align-items:center;gap:13px;padding:15px 16px 12px}
  .logo{width:46px;height:46px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:-.5px;box-shadow:var(--shadow-sm)}
  .sc-name{flex:1;min-width:0}
  .sc-name .nm{font-size:17.5px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
  .sc-name .head{font-size:13.5px;color:var(--ink-soft);margin-top:2px;line-height:1.3}
  .sc-name .head .win{color:var(--penny);font-weight:600}
  .chev{color:var(--ink-faint);flex:none}
  .chev svg{width:19px;height:19px;display:block}

  .ribbon{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:999px}
  .ribbon.penny{background:var(--teal-soft);color:var(--teal-ink)}
  .ribbon.rare{background:var(--gold-soft);color:var(--gold)}
  .ribbon svg{width:12px;height:12px}

  /* peek strip of real photos */
  .peek{display:flex;gap:7px;padding:2px 16px 15px}
  .peek .tile{position:relative;flex:1;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line-soft);border:1px solid var(--line)}
  .peek .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .peek .tile .tag{position:absolute;left:6px;bottom:6px;background:rgba(15,110,86,.96);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;letter-spacing:.01em}
  .peek .more{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink);font-weight:700;border:1px solid #d7e8e1}
  .peek .more .n{font-size:18px;line-height:1}
  .peek .more .t{font-size:10.5px;margin-top:2px;letter-spacing:.02em}

  /* text-row store (photo-light, honest) */
  .sc-textrow{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
  .pill{font-size:12px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:500}
  .pill b{color:var(--ink);font-weight:600}
  .pill.good{color:var(--teal-ink);background:var(--teal-soft);border-color:#d7e8e1}

  /* category quick row on home */
  .cat-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none}
  .cat-scroll::-webkit-scrollbar{display:none}
  .cat-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:74px;cursor:pointer}
  .cat-chip .ic{width:56px;height:56px;border-radius:17px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);color:var(--teal-ink)}
  .cat-chip .ic svg{width:24px;height:24px}
  .cat-chip span{font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.2;font-weight:500}
  .cat-chip:active .ic{transform:scale(.94)}

  .honest{display:flex;gap:9px;align-items:flex-start;margin:8px 18px 4px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink-soft);font-size:12.5px;line-height:1.45;box-shadow:var(--shadow-sm)}
  .honest svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--ink-faint)}

  /* ---------- store page header ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(245,246,248,.86);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
  .topbar-in{display:flex;align-items:center;gap:11px;padding:11px 14px}
  .back{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:var(--shadow-sm)}
  .back:active{transform:scale(.94)}
  .back svg{width:18px;height:18px;color:var(--ink)}
  .topbar-in .tt{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .topbar-in .ts{font-size:12px;color:var(--ink-soft);margin-top:1px}

  .store-hero{display:flex;align-items:center;gap:13px;padding:16px 18px 6px}
  .store-hero .logo{width:52px;height:52px;font-size:19px}
  .store-hero h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
  .store-hero .sub{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .store-hero .sub .win{color:var(--penny);font-weight:600}

  /* filter chips */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 6px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;font-size:13px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;font-weight:500;transition:all .12s}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fchip:active{transform:scale(.96)}

  /* product grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:12px 18px 26px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;display:flex;flex-direction:column}
  .pcard:active{transform:scale(.97)}
  .pcard .ph{position:relative;width:100%;aspect-ratio:1;background:var(--line-soft);overflow:hidden}
  .pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard .badge{position:absolute;top:9px;left:9px;background:rgba(15,110,86,.97);color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px;letter-spacing:.01em;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .pcard .rare-dot{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.16);color:var(--gold)}
  .pcard .rare-dot svg{width:13px;height:13px}
  .pcard .body{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
  .pcard .ttl{font-size:13.5px;font-weight:600;line-height:1.28;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
  .pcard .meta{margin-top:auto;padding-top:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
  .pcard .price{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--ink);line-height:1}
  .pcard .price.cent{color:var(--penny)}
  .pcard .was{font-size:11.5px;color:var(--ink-faint);text-decoration:line-through;margin-top:3px}
  .pcard .vrf{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--teal-ink);font-weight:600}
  .pcard .vrf svg{width:11px;height:11px}

  /* text list (photo-light store page) */
  .tlist{padding:8px 18px 26px;display:flex;flex-direction:column;gap:10px}
  .trow{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px;box-shadow:var(--shadow-sm);cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .12s}
  .trow:active{transform:scale(.985)}
  .trow .thumb{width:48px;height:48px;border-radius:11px;overflow:hidden;flex:none;background:var(--line-soft);border:1px solid var(--line)}
  .trow .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .trow .ti2{flex:1;min-width:0}
  .trow .ti2 .n{font-size:14.5px;font-weight:600;line-height:1.25;letter-spacing:-.1px}
  .trow .ti2 .s{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .trow .kind{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
  .trow .kind.clr{background:#eef0f3;color:var(--ink-soft)}
  .trow .pr{text-align:right;flex:none}
  .trow .pr .p{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .trow .pr .o{font-size:11px;color:var(--penny);font-weight:700}
  .trow .chev2{color:var(--ink-faint);flex:none}
  .trow .chev2 svg{width:17px;height:17px;display:block}

  .light-note{margin:6px 18px 0;padding:13px 15px;background:var(--blue-soft);border:1px solid #d4e4f6;border-radius:14px;color:#13456f;font-size:12.5px;line-height:1.45;display:flex;gap:9px}
  .light-note svg{width:16px;height:16px;flex:none;margin-top:1px}

  /* ---------- deal detail ---------- */
  .detail-photo{width:100%;aspect-ratio:1;background:var(--line-soft);position:relative;overflow:hidden}
  .detail-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-photo .dp-back{position:absolute;top:14px;left:14px;z-index:5}
  .detail-photo .dp-rare{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:var(--gold);font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;box-shadow:var(--shadow-sm)}
  .detail-photo .dp-rare svg{width:13px;height:13px}
  .detail-noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:6px}
  .detail-noimg .big{font-size:40px;font-weight:800;letter-spacing:-1px}
  .detail-noimg .lbl{font-size:13px;color:var(--ink-soft)}

  .detail-body{padding:18px 20px 30px}
  .d-store{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);font-weight:600}
  .d-store .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
  .detail-body h1{font-size:23px;line-height:1.18;margin:8px 0 0;font-weight:700;letter-spacing:-.3px}
  .pricebox{display:flex;align-items:baseline;gap:12px;margin:15px 0 6px}
  .pricebox .now{font-size:42px;font-weight:800;letter-spacing:-1.4px;line-height:1;color:var(--penny)}
  .pricebox .now.reg{color:var(--ink)}
  .pricebox .wasbig{font-size:16px;color:var(--ink-faint);text-decoration:line-through}
  .pricebox .save{font-size:13px;font-weight:700;color:var(--teal-ink);background:var(--teal-soft);padding:4px 10px;border-radius:999px;align-self:center}
  .story{font-size:14px;color:var(--ink-soft);line-height:1.5;margin:2px 0 0}
  .story b{color:var(--penny);font-weight:700}

  .vrow{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:13.5px;color:var(--teal-ink);font-weight:600}
  .vrow svg{width:17px;height:17px;flex:none}
  .vrow.calm{color:var(--ink-soft);font-weight:500}
  .vrow.calm svg{color:var(--ink-faint)}

  .howto{margin:18px 0 0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .howto .hh{padding:14px 16px 11px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;border-bottom:1px solid var(--line-soft)}
  .step{display:flex;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .step:last-child{border-bottom:0}
  .step .ic{width:38px;height:38px;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;flex:none}
  .step .ic svg{width:19px;height:19px}
  .step .tx .h{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
  .step .tx .d{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}

  .sku-box{margin:14px 16px;background:#15171c;border-radius:14px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between}
  .sku-box .l{color:#aeb4c0;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .sku-box .v{color:#fff;font-size:21px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;margin-top:2px}
  .sku-box .scan{width:42px;height:42px;border-radius:11px;background:#23262e;display:flex;align-items:center;justify-content:center;color:#fff}
  .sku-box .scan svg{width:21px;height:21px}

  .check-tag{display:flex;gap:9px;align-items:flex-start;margin:16px 0 0;padding:13px 15px;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--ink-soft);font-size:12.5px;line-height:1.45}
  .check-tag svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--ink-faint)}

  .cta{margin:20px 0 0;display:flex;gap:11px}
  .cta button{flex:1;border:none;border-radius:15px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.1px;transition:transform .12s}
  .cta button:active{transform:scale(.97)}
  .cta .primary{background:var(--teal);color:#fff}
  .cta .ghost{flex:none;width:56px;background:#fff;border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .cta .ghost svg{width:20px;height:20px}

  /* bottom tab bar */
  .tabbar{position:sticky;bottom:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-top:1px solid var(--line);display:flex;padding:9px 14px 22px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:.01em}
  .tab svg{width:23px;height:23px}
  .tab.on{color:var(--teal)}
  .tab:active{transform:scale(.95)}

  .end-pad{height:6px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen" id="screen">

    <!-- ============ HOME: PICK A STORE ============ -->
    <section class="view active" id="view-home">
      <div class="status">
        <span>9:41</span>
        <span class="dots">
          <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="6" width="3" height="5" rx="1" fill="#15171c"/><rect x="4.5" y="4" width="3" height="7" rx="1" fill="#15171c"/><rect x="9" y="2" width="3" height="9" rx="1" fill="#15171c"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#15171c"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2 0 3.8.8 5.1 2l1-1.1A8.6 8.6 0 0 0 8 .6 8.6 8.6 0 0 0 1.9 3l1 1.1A7.1 7.1 0 0 1 8 2.2Z" fill="#15171c"/><path d="M8 5.4c1.1 0 2.1.4 2.9 1.1l1-1.1A5.9 5.9 0 0 0 8 3.8a5.9 5.9 0 0 0-3.9 1.6l1 1.1A4.3 4.3 0 0 1 8 5.4Z" fill="#15171c"/><circle cx="8" cy="9" r="1.6" fill="#15171c"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#15171c" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="#15171c"/><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#15171c" opacity=".5"/></svg>
        </span>
      </div>

      <div class="home-head">
        <div class="hi">Good morning, Steven</div>
        <h1>Pick a store.<br><span class="accent">See today's deals.</span></h1>
        <div class="loc">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="2"/></svg>
          Stores near <b>Austin, TX</b>
        </div>
      </div>

      <div class="section-label">
        <h2>Your stores today</h2>
        <span class="cnt" id="store-count"></span>
      </div>

      <div id="store-list"></div>

      <div class="section-label" style="margin-top:22px">
        <h2>Browse by category</h2>
      </div>
      <div class="cat-scroll" id="cat-scroll"></div>

      <div class="honest">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor"/></svg>
        <span>These are deals other shoppers reported — not live store stock. Prices change, so check the tag in store.</span>
      </div>
      <div class="end-pad"></div>
    </section>

    <!-- ============ STORE PAGE ============ -->
    <section class="view" id="view-store">
      <div class="topbar">
        <div class="topbar-in">
          <div class="back" onclick="goHome()" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="tt" id="store-bar-name">Store</div>
            <div class="ts" id="store-bar-sub"></div>
          </div>
        </div>
      </div>
      <div class="store-hero">
        <div class="logo" id="store-hero-logo">DT</div>
        <div>
          <h1 id="store-hero-name">Store</h1>
          <div class="sub" id="store-hero-sub"></div>
        </div>
      </div>
      <div id="store-filters"></div>
      <div id="store-content"></div>
    </section>

    <!-- ============ DEAL DETAIL ============ -->
    <section class="view" id="view-detail">
      <div id="detail-content"></div>
    </section>

  </div>
</div>

<script src="../deal-hunter-staging/data.js"></script>
<script>
(function(){
  "use strict";
  var ALL = (window.STAGING_DEALS || []);
  var IMG = "../deal-hunter-staging/";

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function sentence(s){
    s = String(s||"").trim();
    if(!s) return "";
    // Fix ALL-CAPS words but keep short acronyms & known brand bits readable
    var keep = {"XOXO":1,"DT":1,"PK":1,"LC":1,"QTR":1,"3D":1,"LED":1,"USB":1,"X-MEN":1};
    var words = s.split(/\s+/).map(function(w,i){
      var bare = w.replace(/[^A-Za-z-]/g,"");
      if(keep[bare.toUpperCase()] && bare.length<=5) return w;
      if(/^[A-Z0-9&'.\-]+$/.test(w) && /[A-Z]/.test(w) && w.length>2){
        var lo = w.toLowerCase();
        return lo;
      }
      return w;
    });
    var out = words.join(" ");
    out = out.charAt(0).toUpperCase() + out.slice(1);
    // re-capitalize obvious proper nouns we lowercased
    return out;
  }
  // Friendlier titles: many feed titles are SKU-shorthand; clean lightly.
  function niceTitle(d){
    var t = d.title || "";
    t = t.replace(/\bLic\b/i,"licensed").replace(/\bQtr\b/i,"quarter").replace(/\bLC\b/,"low-cut").replace(/\bMen'?s\b/i,"men's").replace(/\bLadies\b/i,"ladies");
    t = sentence(t);
    if(!t || t==="(deal)" || t==="Deal") t = friendlyCategory(d.category);
    return t;
  }
  function friendlyCategory(c){
    c = String(c||"").trim();
    if(!c) return "Store find";
    var map = {
      "APPAREL (socks / underwear / boxers)":"Socks & basics",
      "HOUSEHOLD DISPOSABLES / FRAGRANCE":"Home & fragrance",
      "CANDY / NON-CHOC / SEASONAL":"Candy & seasonal",
      "HOUSEHOLD CONSUMABLES":"Household",
      "HOUSEHOLD PRODUCTS":"Household",
      "HEALTH CARE":"Health & care",
      "PERSONAL CARE":"Personal care",
      "baby personal care":"Baby care",
      "personal care":"Personal care",
      "TOYS EVERYDAY":"Toys",
      "PET SUPPLIES":"Pet",
      "HOME DECOR":"Home decor",
      "CHECKOUTS":"Checkout finds",
      "KITCHENWARE":"Kitchen",
      "BEVERAGES":"Drinks",
      "CRAFTS":"Crafts",
      "FOOD":"Food",
      "kitchen":"Kitchen",
      "socks":"Socks & basics"
    };
    if(map[c]) return map[c];
    return c.charAt(0).toUpperCase()+c.slice(1).toLowerCase();
  }
  function isPenny(d){ return d.price === "$0.01"; }
  // Mark a deal as a notable / rare find for resellers (licensed character socks etc.)
  function isRare(d){
    var t=(d.title||"").toLowerCase();
    return /smurf|x-men|elmo|oscar|mona lisa|cheez|kool-aid|mountain dew|sesame|grouch|character|licensed/.test(t);
  }
  // store brand colors (logo tile) — NO orange anywhere
  function storeBrand(name){
    var m = {
      "Dollar Tree":   {bg:"#0f6e56", fg:"#ffffff", abbr:"DT"},
      "Walmart":       {bg:"#185fa5", fg:"#ffffff", abbr:"W"},
      "Target":        {bg:"#a32d2d", fg:"#ffffff", abbr:"T"},
      "Dollar General":{bg:"#1f3a5f", fg:"#ffffff", abbr:"DG"},
      "Walgreens":     {bg:"#143f86", fg:"#ffffff", abbr:"Wg"},
      "CVS":           {bg:"#7a1f1f", fg:"#ffffff", abbr:"CVS"},
      "Family Dollar": {bg:"#0b5945", fg:"#ffffff", abbr:"FD"},
      "Publix":        {bg:"#1c6e3a", fg:"#ffffff", abbr:"P"},
      "Kroger":        {bg:"#13457a", fg:"#ffffff", abbr:"K"},
      "Home Depot":    {bg:"#3a3f47", fg:"#ffffff", abbr:"HD"},
      "Food Lion":     {bg:"#1f5fa5", fg:"#ffffff", abbr:"FL"},
      "Aldi":          {bg:"#185fa5", fg:"#ffffff", abbr:"A"},
      "H-E-B":         {bg:"#a32d2d", fg:"#ffffff", abbr:"HEB"},
      "Amazon":        {bg:"#23262e", fg:"#ffffff", abbr:"az"},
      "7-Eleven":      {bg:"#1c6e3a", fg:"#ffffff", abbr:"7E"},
      "Fred Meyer":    {bg:"#13457a", fg:"#ffffff", abbr:"FM"}
    };
    return m[name] || {bg:"#5f5e5a", fg:"#ffffff", abbr:(name||"?").slice(0,2)};
  }
  function dealKindLabel(d){
    var k = d.dealType;
    if(k==="clearance") return {t:"Clearance", cls:"clr"};
    if(k==="coupon") return {t:"Coupon deal", cls:""};
    if(k==="bogo") return {t:"Buy 1 get 1", cls:""};
    if(k==="sale") return {t:"Sale", cls:""};
    if(k==="glitch") return {t:"Price mistake", cls:"clr"};
    return {t:"Deal", cls:""};
  }

  /* ---------- group by store ---------- */
  var groups = {};
  ALL.forEach(function(d){
    var r = d.retailer;
    if(!r) return;                 // skip the un-attributed feed noise on a store-first home
    if(!groups[r]) groups[r] = {name:r, deals:[], photos:[]};
    groups[r].deals.push(d);
    if(d.image) groups[r].photos.push(d);
  });
  var stores = Object.keys(groups).map(function(k){return groups[k];});
  // rank: photo-rich first, then by deal count; tiny single-deal feeds dropped from home
  stores = stores.filter(function(s){ return s.deals.length >= 3 || s.photos.length>0; });
  stores.sort(function(a,b){
    if((b.photos.length>0)-(a.photos.length>0)) return (b.photos.length>0)-(a.photos.length>0);
    return b.deals.length - a.deals.length;
  });

  function storeHeadline(s){
    if(s.photos.length>=20){
      return {html:'<span class="win">'+s.photos.length+' items at 1¢ today</span> · socks, toys, health & more', win:true};
    }
    if(s.name==="Dollar Tree"){
      return {html:'<span class="win">'+s.deals.length+' penny deals</span> reported this week', win:true};
    }
    var n = s.deals.length;
    var word = n===1 ? "deal" : "deals";
    return {html:n+' '+word+' shoppers reported', win:false};
  }

  /* ---------- render HOME store list ---------- */
  function renderHome(){
    var list = document.getElementById("store-list");
    document.getElementById("store-count").textContent = stores.length + " stores";
    var html = "";
    stores.forEach(function(s){
      var b = storeBrand(s.name);
      var hl = storeHeadline(s);
      var feature = s.photos.length>=10;
      html += '<div class="store-card'+(feature?' feature':'')+'" onclick="openStore(\''+esc(s.name).replace(/'/g,"\\'")+'\')">';
      html +=   '<div class="sc-top">';
      html +=     '<div class="logo" style="background:'+b.bg+';color:'+b.fg+'">'+esc(b.abbr)+'</div>';
      html +=     '<div class="sc-name"><div class="nm">'+esc(s.name)+'</div><div class="head">'+hl.html+'</div></div>';
      html +=     '<div class="chev"><svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      html +=   '</div>';

      if(s.photos.length>=3){
        // peek strip — only when there are enough real photos to read as a strip
        // (Dollar Tree). 1–2 photos would stretch into a fake "hero", so those
        // stores fall through to the honest text treatment below.
        var peek = s.photos.slice(0,3);
        html += '<div class="peek">';
        peek.forEach(function(d){
          html += '<div class="tile"><img src="'+IMG+esc(d.image)+'" loading="lazy" onerror="this.parentNode.style.display=\'none\'"><span class="tag">1¢</span></div>';
        });
        if(s.photos.length>3){
          html += '<div class="more"><span class="n">+'+(s.photos.length-3)+'</span><span class="t">more</span></div>';
        }
        html += '</div>';
      } else {
        // honest text pills, no fake photo grid
        html += '<div class="sc-textrow">';
        var kinds = {};
        s.deals.forEach(function(d){ var k=dealKindLabel(d).t; kinds[k]=(kinds[k]||0)+1; });
        var best = s.deals.filter(function(d){return d.off;}).sort(function(a,b){return parseInt(b.off)-parseInt(a.off);})[0];
        if(best && parseInt(best.off)>=40){
          html += '<span class="pill good">Up to <b>&nbsp;'+esc(best.off)+' off</b></span>';
        }
        Object.keys(kinds).slice(0,3).forEach(function(k){
          html += '<span class="pill"><b>'+kinds[k]+'</b>&nbsp;'+esc(k.toLowerCase())+'</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    list.innerHTML = html;
  }

  /* ---------- categories row (real, from DT photo data) ---------- */
  function renderCats(){
    var icons = {
      "Socks & basics":'<path d="M7 3h7v6l4 5v5a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-4l-4-4V3Z"/>',
      "Health & care":'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M9 9V6a3 3 0 0 1 6 0v3M12 13v3M10.5 14.5h3"/>',
      "Toys":'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
      "Kitchen":'<path d="M6 3v8a3 3 0 0 0 6 0V3M9 3v18M18 3c-1.5 1.5-1.5 4-1.5 6S18 13 18 14v7"/>',
      "Drinks":'<path d="M6 4h12l-1.5 15a2 2 0 0 1-2 1.8H9.5a2 2 0 0 1-2-1.8L6 4ZM7 9h10"/>',
      "Crafts":'<path d="M12 3l2.5 5 5.5.5-4 3.8 1.2 5.4L12 20l-5.2 2.7L8 17.3 4 13.5l5.5-.5L12 3Z"/>',
      "Home & fragrance":'<path d="M5 21V9l7-5 7 5v12M9 21v-6h6v6"/>'
    };
    var order = ["Socks & basics","Health & care","Toys","Kitchen","Drinks","Crafts","Home & fragrance"];
    var box = document.getElementById("cat-scroll");
    var html = "";
    order.forEach(function(name){
      html += '<div class="cat-chip" onclick="openCategory(\''+name+'\')"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(icons[name]||'')+'</svg></div><span>'+name+'</span></div>';
    });
    box.innerHTML = html;
  }

  /* ---------- STORE PAGE ---------- */
  var currentStore = null;
  var currentFilter = "all";

  window.openStore = function(name){
    currentStore = groups[name];
    currentFilter = "all";
    if(!currentStore) return;
    var b = storeBrand(name);
    document.getElementById("store-bar-name").textContent = name;
    document.getElementById("store-hero-logo").style.background = b.bg;
    document.getElementById("store-hero-logo").style.color = b.fg;
    document.getElementById("store-hero-logo").textContent = b.abbr;
    document.getElementById("store-hero-name").textContent = name;

    var photoN = currentStore.photos.length;
    var dealN = currentStore.deals.length;
    var sub, barsub;
    if(photoN>=20){
      sub = '<span class="win">'+photoN+' items at 1¢</span> · best finds first';
      barsub = photoN+' penny finds';
    } else {
      sub = dealN+' deals shoppers reported here';
      barsub = dealN+' deals';
    }
    document.getElementById("store-hero-sub").innerHTML = sub;
    document.getElementById("store-bar-sub").textContent = barsub;

    renderStoreFilters();
    renderStoreContent();
    switchView("view-store");
    document.getElementById("screen").scrollTop = 0;
  };

  function renderStoreFilters(){
    var s = currentStore;
    var box = document.getElementById("store-filters");
    if(s.photos.length<3){ box.innerHTML=""; return; }
    // build category filters from photo deals
    var cats = {};
    s.photos.forEach(function(d){ var c=friendlyCategory(d.category); cats[c]=(cats[c]||0)+1; });
    var topCats = Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}).slice(0,5);
    var html = '<div class="filters">';
    html += '<div class="fchip'+(currentFilter==="all"?" on":"")+'" onclick="setFilter(\'all\')">All finds</div>';
    if(s.deals.some(isRare)) html += '<div class="fchip'+(currentFilter==="rare"?" on":"")+'" onclick="setFilter(\'rare\')">Rare & licensed</div>';
    topCats.forEach(function(c){
      html += '<div class="fchip'+(currentFilter===c?" on":"")+'" onclick="setFilter(\''+c.replace(/'/g,"\\'")+'\')">'+esc(c)+'</div>';
    });
    html += '</div>';
    box.innerHTML = html;
  }
  window.setFilter = function(f){ currentFilter=f; renderStoreFilters(); renderStoreContent(); };

  function renderStoreContent(){
    var s = currentStore;
    var box = document.getElementById("store-content");
    if(s.photos.length>=3){
      // photo grid (penny finds first), honest text list for the rest below if needed
      var photos = s.photos.slice();
      if(currentFilter==="rare") photos = photos.filter(isRare);
      else if(currentFilter!=="all") photos = photos.filter(function(d){ return friendlyCategory(d.category)===currentFilter; });
      // rare/licensed first, then rest
      photos.sort(function(a,b){ return (isRare(b)?1:0)-(isRare(a)?1:0); });
      var html = '<div class="grid">';
      photos.forEach(function(d){
        html += productCard(d);
      });
      html += '</div>';
      box.innerHTML = html;
    } else {
      // photo-light store: honest clean text list
      var deals = s.deals.slice().sort(function(a,b){
        return (b.off?parseInt(b.off):0) - (a.off?parseInt(a.off):0);
      });
      var html = '';
      var photoNote = s.photos.length>0
        ? 'Only a few of these have photos yet — here are all the deals shoppers reported at '+esc(s.name)+', best savings first.'
        : 'No photos yet for '+esc(s.name)+' — here are the deals shoppers reported, best savings first.';
      html += '<div class="light-note"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.05" fill="currentColor"/></svg><span>'+photoNote+'</span></div>';
      html += '<div class="tlist">';
      deals.forEach(function(d){ html += textRow(d); });
      html += '</div>';
      box.innerHTML = html;
    }
  }

  function productCard(d){
    var penny = isPenny(d);
    var rare = isRare(d);
    var price = penny ? "1¢" : (d.price||"");
    var h = '<div class="pcard" onclick="openDeal(\''+esc(d.id)+'\')">';
    h += '<div class="ph">';
    h += '<img src="'+IMG+esc(d.image)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">';
    if(penny) h += '<span class="badge">1¢</span>';
    if(rare) h += '<span class="rare-dot" title="Rare find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5 5.5.5-4 3.8 1.2 5.4L12 18l-5.2 2.7L8 12.3 4 8.5l5.5-.5L12 3Z"/></svg></span>';
    h += '</div>';
    h += '<div class="body">';
    h += '<div class="ttl">'+esc(niceTitle(d))+'</div>';
    h += '<div class="meta"><div><div class="price'+(penny?' cent':'')+'">'+esc(price)+'</div>'+(d.was?'<div class="was">was '+esc(d.was)+'</div>':'')+'</div>';
    h += '<div class="vrf"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified</div></div>';
    h += '</div></div>';
    return h;
  }

  function textRow(d){
    var kind = dealKindLabel(d);
    var price = d.price ? esc(d.price) : "See in store";
    var h = '<div class="trow" onclick="openDeal(\''+esc(d.id)+'\')">';
    if(d.image){
      h += '<div class="thumb"><img src="'+IMG+esc(d.image)+'" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></div>';
    }
    h += '<div class="ti2"><div class="n">'+esc(niceTitle(d))+'</div>';
    h += '<div class="s"><span class="kind '+kind.cls+'">'+esc(kind.t)+'</span>'+(d.category?'<span>'+esc(friendlyCategory(d.category))+'</span>':'')+'</div></div>';
    h += '<div class="pr"><div class="p">'+price+'</div>'+(d.off?'<div class="o">'+esc(d.off)+' off</div>':(d.was?'<div class="o" style="color:#8a909c">was '+esc(d.was)+'</div>':''))+'</div>';
    h += '<div class="chev2"><svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
    h += '</div>';
    return h;
  }

  /* ---------- DEAL DETAIL ---------- */
  var prevView = "view-store";
  window.openDeal = function(id){
    var d = ALL.filter(function(x){return x.id===id;})[0];
    if(!d) return;
    prevView = document.querySelector(".view.active").id;
    document.getElementById("detail-content").innerHTML = detailHTML(d);
    switchView("view-detail");
    document.getElementById("screen").scrollTop = 0;
  };

  function detailHTML(d){
    var penny = isPenny(d);
    var rare = isRare(d);
    var b = storeBrand(d.retailer);
    var kind = dealKindLabel(d);
    var h = "";

    // photo (or honest no-photo block)
    if(d.image){
      h += '<div class="detail-photo">';
      h += '<div class="dp-back back" onclick="backFromDetail()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      if(rare) h += '<div class="dp-rare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5 5.5.5-4 3.8 1.2 5.4L12 18l-5.2 2.7L8 12.3 4 8.5l5.5-.5L12 3Z"/></svg>Rare find</div>';
      h += '<img src="'+IMG+esc(d.image)+'" onerror="this.style.visibility=\'hidden\'">';
      h += '</div>';
    } else {
      h += '<div class="detail-photo" style="aspect-ratio:auto;background:'+b.bg+'">';
      h += '<div class="dp-back back" onclick="backFromDetail()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      h += '<div class="detail-noimg" style="color:#fff;min-height:200px">';
      h += '<div class="big">'+esc(d.price||"Deal")+'</div>';
      h += '<div class="lbl" style="color:rgba(255,255,255,.85)">'+esc(kind.t)+' at '+esc(d.retailer)+'</div>';
      h += '</div></div>';
    }

    h += '<div class="detail-body">';
    h += '<div class="d-store"><span class="dot" style="background:'+b.bg+'"></span>'+esc(d.retailer||"Store")+'</div>';
    h += '<h1>'+esc(niceTitle(d))+'</h1>';

    // price story
    if(penny){
      h += '<div class="pricebox"><span class="now">1¢</span>';
      if(d.was) h += '<span class="wasbig">was '+esc(d.was)+'</span>';
      h += '</div>';
      h += '<p class="story">'+(d.was? 'Was '+esc(d.was)+' → <b>now 1¢</b> at Dollar Tree. ' : '<b>1¢ at Dollar Tree.</b> ')+'Penny items are last-of-stock — when they ring up at a cent, that\'s the win.</p>';
    } else if(d.dealType==="glitch"){
      h += '<div class="pricebox"><span class="now reg">'+esc(d.price||"")+'</span>';
      if(d.was) h += '<span class="wasbig">was '+esc(d.was)+'</span>';
      if(d.off) h += '<span class="save">'+esc(d.off)+' off</span>';
      h += '</div>';
      h += '<p class="story">A possible price mistake shoppers spotted. <b style="color:#5b6270">Might not ring up</b> — worth a look, but don\'t count on it.</p>';
    } else {
      h += '<div class="pricebox"><span class="now reg">'+esc(d.price||"See in store")+'</span>';
      if(d.was) h += '<span class="wasbig">was '+esc(d.was)+'</span>';
      if(d.off) h += '<span class="save">'+esc(d.off)+' off</span>';
      h += '</div>';
      var line = kind.t + (d.was&&d.price ? ' — was '+esc(d.was)+', now '+esc(d.price)+'.' : ' shoppers reported at '+esc(d.retailer)+'.');
      h += '<p class="story">'+esc(d.dealType==='bogo'?'Buy one get one — ':'' )+line+'</p>';
    }

    // trust line — calm, plain
    if(d.image){
      h += '<div class="vrow"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.5l2.5 2.5L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified product — photo matches our catalog</div>';
    } else {
      h += '<div class="vrow calm"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Shoppers reported this deal</div>';
    }

    // how to find it
    h += '<div class="howto"><div class="hh">How to find it in the store</div>';
    if(penny){
      h += step('aisle','Check the aisle for the item','Penny list items live on the normal shelf — look where this type of product usually sits.');
      h += step('scan','Scan to be sure it\'s a penny','Use the price scanner in store, or have the cashier scan the SKU below.');
      h += step('tag','Bring it to checkout','If it rings up at 1¢, it\'s yours. Stores honor what scans.');
    } else if(d.dealType==='coupon'){
      h += step('aisle','Find it on the shelf at '+esc(d.retailer),'Look in the '+esc(friendlyCategory(d.category)).toLowerCase()+' aisle.');
      h += step('coupon','Clip the coupon first','This price needs a coupon — load it to your store account or app before you go.');
      h += step('tag','Check the price at checkout','Coupon deals change weekly. Confirm it before you buy.');
    } else {
      h += step('aisle','Find it on the shelf at '+esc(d.retailer),'Look in the '+esc(friendlyCategory(d.category)).toLowerCase()+' aisle.');
      h += step('tag','Check the shelf tag','Make sure the tag matches this price — sale prices change.');
    }
    // SKU box (only when we have one)
    if(d.sku){
      h += '<div class="sku-box"><div><div class="l">Scan in store</div><div class="v">SKU '+esc(d.sku)+'</div></div><div class="scan"><svg viewBox="0 0 24 24" fill="none"><path d="M3 5v14M6 5v14M9 5v14M13 5v14M16 5v14M19 5v14M21 5v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div></div>';
    }
    h += '</div>'; // howto

    // honest check-tag note
    h += '<div class="check-tag"><svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3 8-8M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Prices change — always check the tag in store. This is what a shopper reported, not live stock.</span></div>';

    // actions
    h += '<div class="cta"><button class="primary" onclick="backFromDetail()">Add to my list</button>';
    h += '<button class="ghost" aria-label="Save"><svg viewBox="0 0 24 24" fill="none"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button></div>';

    h += '</div>'; // detail-body
    return h;
  }

  function step(icon, head, desc){
    var paths = {
      aisle:'<path d="M4 21V6l8-3 8 3v15M9 21v-6h6v6M4 9h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
      scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
      tag:'<path d="M3 12l9 9 9-9-9-9H7a4 4 0 0 0-4 4v5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/>',
      coupon:'<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 8v8" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/>'
    };
    return '<div class="step"><div class="ic"><svg viewBox="0 0 24 24" fill="none">'+(paths[icon]||paths.tag)+'</svg></div><div class="tx"><div class="h">'+esc(head)+'</div><div class="d">'+esc(desc)+'</div></div></div>';
  }

  window.backFromDetail = function(){ switchView(prevView); document.getElementById("screen").scrollTop = 0; };

  /* ---------- category from home: jump into a filtered Dollar Tree view ---------- */
  window.openCategory = function(catName){
    // categories are Dollar Tree photo categories; open DT filtered
    openStore("Dollar Tree");
    setTimeout(function(){ setFilter(catName); }, 20);
  };

  /* ---------- view switching ---------- */
  function switchView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("active", v.id===id); });
  }
  window.goHome = function(){ switchView("view-home"); document.getElementById("screen").scrollTop = 0; };

  /* ---------- boot ---------- */
  renderHome();
  renderCats();
})();
</script>
</body>
</html>
